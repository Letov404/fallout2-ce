workflows:
  ios-ipa:
    name: Build Chinese iOS IPA (ai-fix)
    max_build_duration: 60
    scripts:
      - name: Build IPA
        script: |
          set -e
          git clone -b truetype-support --depth 1 https://github.com/sonilyan/fallout2-ce.git f2src
          sed -i '' 's/GIT_TAG "v1.2.11"/GIT_TAG "v1.3.1"/' f2src/third_party/zlib/CMakeLists.txt
          plutil -insert LSSupportsOpeningDocumentsInPlace -bool true f2src/os/ios/Info.plist
          cp combat_ai_patched.cc f2src/src/combat_ai.cc
          cd f2src
          cmake -B build -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake -D ENABLE_BITCODE=0 -D PLATFORM=OS64 -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -G Xcode -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=''
          cmake --build build --config RelWithDebInfo -j 8
          cd build && cpack -C RelWithDebInfo
    artifacts:
      - f2src/build/fallout2-ce.ipa