workflows:
  ios-ipa:
    name: Build Chinese iOS IPA
    max_build_duration: 60
    scripts:
      - name: Build IPA
        script: |
          set -e
          git clone -b truetype-support --depth 1 https://github.com/sonilyan/fallout2-ce.git src
          cd src
          cmake -B build -D CMAKE_TOOLCHAIN_FILE=cmake/toolchain/ios.toolchain.cmake -D ENABLE_BITCODE=0 -D PLATFORM=OS64 -G Xcode -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=''
          cmake --build build --config RelWithDebInfo -j 8
          cd build && cpack -C RelWithDebInfo
    artifacts:
      - src/build/fallout2-ce.ipa
